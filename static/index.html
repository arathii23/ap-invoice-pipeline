<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>InvoiceDesk · Accounts payable</title>
<meta name="description" content="Upload vendor invoices as PDFs, photos, e-mails or ZIP batches. Each one is read, matched to its purchase order, checked against policy and approved, held or rejected — with every reason visible.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f2a4a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%231d3f6e%27/%3E%3Cstop offset=%271%27 stop-color=%27%230f2a4a%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M10 16.5l4 4 8-9%27 stroke=%27white%27 stroke-width=%273%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f9;--surface:#fff;--raised:#fff;--sunken:#eef2f6;--ink:#0f1b2d;--ink2:#3b4859;--mut:#5f6b7c;--line:#e1e6ed;--line2:#c9d2de;
  --acc:#1f4fb8;--acc-h:#173f96;--accb:#e9effa;--acc2:#0f6e6a;--brand:#0f2a4a;
  --ok:#0b6b4f;--okb:#e4f2ec;--warn:#a35a00;--warnb:#fbf1e0;--bad:#b42328;--badb:#fbe9ea;--info:#0b5c8c;--infob:#e5eff7;
  --r:12px;--sh:0 1px 2px rgba(16,18,24,.04),0 2px 8px -2px rgba(16,18,24,.06);--sh2:0 10px 30px -10px rgba(16,18,24,.25),0 2px 6px rgba(16,18,24,.06);
  --side:236px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri,:root:not([data-theme=light]) .hero .steps b i{color:#0b1320}}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b1320;--surface:#111b2b;--raised:#162236;--sunken:#162133;--ink:#e6ecf3;--ink2:#b3bfcd;--mut:#8493a6;--line:#1f2c40;--line2:#2d3c54;
  --acc:#7aa2f0;--acc-h:#98b8f5;--accb:#15274a;--acc2:#4fb3ab;--brand:#0f2a4a;--ok:#3fb98c;--okb:#0e2a22;--warn:#e6a04a;--warnb:#2d2213;--bad:#ec767c;--badb:#33191d;--info:#62acd8;--infob:#0f2537;--sh:none;--sh2:0 12px 32px -8px rgba(0,0,0,.6)}}
:root[data-theme=dark] .btn.pri,:root[data-theme=dark] .hero .steps b i{color:#0b1320}
:root[data-theme=dark]{
  --bg:#0b1320;--surface:#111b2b;--raised:#162236;--sunken:#162133;--ink:#e6ecf3;--ink2:#b3bfcd;--mut:#8493a6;--line:#1f2c40;--line2:#2d3c54;
  --acc:#7aa2f0;--acc-h:#98b8f5;--accb:#15274a;--acc2:#4fb3ab;--brand:#0f2a4a;--ok:#3fb98c;--okb:#0e2a22;--warn:#e6a04a;--warnb:#2d2213;--bad:#ec767c;--badb:#33191d;--info:#62acd8;--infob:#0f2537;--sh:none;--sh2:0 12px 32px -8px rgba(0,0,0,.6)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-padding-top:20px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--acc);color:#fff;padding:8px 12px;border-radius:8px}.skip:focus{left:8px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);background:var(--surface);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;overflow-y:auto;overflow-x:hidden}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 6px;font-weight:700;letter-spacing:-.015em;font-size:15px}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(160deg,#1d3f6e,#0f2a4a);display:grid;place-items:center;color:#fff;box-shadow:0 1px 2px rgba(15,27,45,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:11.5px;letter-spacing:0}
.navsec{display:flex;flex-direction:column;gap:1px}
.navsec>span{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:8px 10px 4px}
nav.side a{position:relative;display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink2);font-weight:550}
nav.side a:hover{background:var(--sunken);color:var(--ink)}
nav.side a[aria-current=page]{background:var(--accb);color:var(--acc)}
nav.side a[aria-current=page]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
nav.side .count{margin-left:auto;font-size:11.5px;color:var(--mut);font-weight:600}
nav.side .count.hot{background:var(--warnb);color:var(--warn);border-radius:99px;padding:0 7px;line-height:19px}
.sidefoot{margin-top:auto;font-size:12px;color:var(--mut);padding:10px 8px 0;border-top:1px solid var(--line)}
.sidefoot .row{display:flex;align-items:center;margin-bottom:3px}.sidefoot .sm{display:block;font-size:11.5px;margin:2px 0 8px 13px;line-height:1.5}
.sidefoot .acts{display:flex;gap:6px}
.dotlive{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}.dotlive.off{background:var(--bad)}
.topbar{display:none}
main{padding:28px clamp(16px,3.2vw,44px) 64px;max-width:1320px;width:100%;min-width:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:24px;letter-spacing:-.025em;font-weight:700;line-height:1.25}.page-h p{margin:4px 0 0;color:var(--mut);max-width:68ch}
.page-h .acts{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:650;color:var(--acc);letter-spacing:.02em;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.crumb{display:inline-flex;gap:6px;align-items:center;color:var(--mut);font-weight:550;margin-bottom:10px}.crumb:hover{color:var(--ink)}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card>.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);min-height:50px}
.card>.ch h2{margin:0;font-size:14px;letter-spacing:-.005em;color:var(--ink);font-weight:650;display:flex;gap:8px;align-items:center}
.card>.cb{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--sunken)}.btn:active:not(:disabled){transform:translateY(1px)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 1px 2px rgba(15,27,45,.18)}.btn.pri:hover:not(:disabled){background:var(--acc-h)}
.btn.lg{height:44px;padding:0 20px;font-size:15px}.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}.btn.ghost:hover{background:var(--sunken)}
.btn.danger:hover{color:var(--bad)}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.iconbtn{width:32px;height:32px;padding:0;border-radius:8px}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.badge.nodot:before{display:none}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-bad{background:var(--badb);color:var(--bad)}.b-mut{background:var(--sunken);color:var(--mut)}.b-acc{background:var(--accb);color:var(--acc)}.b-info{background:var(--infob);color:var(--info)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink2)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;animation:sp .7s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.45}}
.skel{background:var(--sunken);border-radius:6px;animation:pulse 1.2s ease-in-out infinite}
.empty{padding:44px 16px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .ill{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin:0 auto 12px;background:var(--accb);color:var(--acc)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:500}
.alert.bad{background:var(--badb);color:var(--bad)}.alert.warn{background:var(--warnb);color:var(--warn)}.alert.info{background:var(--infob);color:var(--info)}.alert .btn{margin-left:auto;height:30px}
.sub{color:var(--mut);font-size:12.5px}.mut{color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
input.f,textarea.f,select.f{width:100%;border:1px solid var(--line2);border-radius:9px;background:var(--surface);padding:8px 11px}
textarea.f{min-height:84px;resize:vertical;line-height:1.5}
input.f:focus,textarea.f:focus{outline:2px solid color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}
label.l{display:block;font-weight:600;font-size:12.5px;margin:0 0 5px;color:var(--ink2)}
kbd{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:2px 5px;background:var(--surface);color:var(--ink2)}
.prose p{margin:0 0 10px;color:var(--ink2)}.prose ul,.prose ol{margin:0 0 10px;padding-left:20px;color:var(--ink2)}.prose li{margin:4px 0}.prose b{color:var(--ink)}
.prose h3{font-size:14px;margin:16px 0 6px}

/* ---------- upload ---------- */
.up-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.drop{position:relative;isolation:isolate;border:1.5px dashed var(--line2);border-radius:14px;padding:36px 20px;text-align:center;cursor:pointer;background:var(--sunken);transition:border-color .15s,background .15s;
  background-image:radial-gradient(var(--line2) 1px,transparent 1.2px);background-size:16px 16px}
.drop::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(ellipse 55% 62% at 50% 50%,var(--sunken) 55%,transparent 100%);transition:opacity .2s}
.drop:hover,.drop.over{border-color:var(--acc);background-color:var(--accb)}.drop.over::before,.drop:hover::before{opacity:.6}
.drop .ic{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 12px;color:var(--acc);box-shadow:var(--sh);transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.drop.over .ic{transform:translateY(-4px) scale(1.06)}
.drop b{font-size:15.5px;letter-spacing:-.01em}.drop p{margin:4px 0 0;color:var(--mut)}
.formats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.formats span{font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.picked{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--surface);animation:in .2s ease}
.picked .fi{width:36px;height:36px;border-radius:9px;background:var(--accb);color:var(--acc);display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.02em}
.picked .meta{min-width:0;flex:1}.picked .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.picked .meta span{color:var(--mut);font-size:12.5px}
.guide{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:14px;color:var(--mut);font-size:12.5px}.guide span{display:inline-flex;gap:6px;align-items:center}
.samples{list-style:none;margin:0;padding:0}
.samples .grp{padding:10px 16px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:var(--sunken);border-bottom:1px solid var(--line)}
.samples li{border-bottom:1px solid var(--line)}.samples li:last-child{border:0}
.samples button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer}
.samples button:hover{background:var(--sunken)}.samples button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.samples button[aria-pressed=true]{background:var(--accb)}
.samples .n{width:22px;color:var(--mut);font-size:12px;font-weight:600}.samples .t{flex:1;min-width:0}.samples .t b{display:block;font-weight:600}.samples .t span{color:var(--mut);font-size:12.5px}
.samples .exp{font-size:11px;font-weight:650;white-space:nowrap}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);flex:none}[aria-pressed=true] .radio{border:5px solid var(--acc)}
.recent a{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}.recent a:last-child{border:0}.recent a:hover{background:var(--sunken)}
.hero{position:relative;overflow:hidden;border-radius:14px;padding:20px 22px;margin-bottom:20px;border:1px solid var(--line);border-top:3px solid var(--acc);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 5%,var(--surface)),var(--surface) 70%)}
.hero h2{margin:0 0 4px;font-size:17px;letter-spacing:-.015em}.hero p{margin:0;color:var(--ink2);max-width:72ch}
.hero .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 14px}
.hero .steps div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.hero .steps b{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-bottom:2px}.hero .steps b i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;display:grid;place-items:center}
.hero .steps span{color:var(--mut);font-size:12.5px}
.hero .x{position:absolute;top:10px;right:10px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- run ---------- */
.run-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.prog{height:3px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .4s ease}
.prog.ok i{background:var(--ok)}.prog.warn i{background:var(--warn)}.prog.bad i{background:var(--bad)}
.prog.live i{background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 40%,#fff),var(--acc));background-size:200% 100%;animation:shine 1.1s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.decision{border-radius:var(--r);border:1px solid;overflow:hidden}
.decision .in{padding:18px}.decision.ok{background:var(--okb);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.decision.warn{background:var(--warnb);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}.decision.bad{background:var(--badb);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.decision.run{background:var(--surface);border-color:var(--line)}
.decision .lab{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px}
.decision.ok .lab{color:var(--ok)}.decision.warn .lab{color:var(--warn)}.decision.bad .lab{color:var(--bad)}
.decision h2{margin:8px 0 6px;font-size:19px;letter-spacing:-.015em;line-height:1.3}
.decision .why{margin:0;color:var(--ink2)}
.decision .next{margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);display:flex;gap:10px;align-items:flex-start}
.decision .next b{font-size:12.5px;color:var(--mut);display:block;margin-bottom:2px;font-weight:600}
.decision .auto{margin-top:10px;font-size:12.5px;color:var(--ink2)}
.reasons{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.reasons li{display:flex;gap:8px;color:var(--ink2)}.reasons li svg{margin-top:3px}
.tl{list-style:none;margin:0;padding:0}
.st{position:relative}
.st>button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:12px;padding:12px 16px;cursor:pointer;align-items:flex-start}
.st>button:hover{background:var(--sunken)}.st>button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.st.new{animation:in .28s cubic-bezier(.2,.7,.2,1)}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px;position:relative;z-index:2}
.dot svg{width:13px;height:13px;stroke-width:2.4}
.s-pass .dot{background:var(--okb);color:var(--ok)}.s-warn .dot,.s-fail_hold .dot,.s-unverified .dot{background:var(--warnb);color:var(--warn)}.s-fail_reject .dot,.s-error .dot{background:var(--badb);color:var(--bad)}.s-info .dot{background:var(--sunken);color:var(--mut)}
.s-pending .dot{border:1.5px dashed var(--line2);color:var(--mut);font-size:11px;font-weight:600;background:var(--surface)}.s-pending .ttl{color:var(--mut);font-weight:500}
.s-running .dot{background:var(--accb);color:var(--acc);box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent);animation:ping 1.4s ease-out infinite}.s-running .ttl{color:var(--acc)}
@keyframes ping{to{box-shadow:0 0 0 9px transparent}}
.st .body{flex:1;min-width:0}.st .row1{display:flex;gap:8px;align-items:center;justify-content:space-between}.ttl{font-weight:600}
.st .sum{color:var(--ink2);margin:2px 0 0;font-size:13px;display:block;overflow-wrap:anywhere}
.st .ms{color:var(--mut);font-size:12px}.chev{transition:transform .15s;color:var(--mut);display:inline-flex}.st.open .chev{transform:rotate(90deg)}
.det{display:none;padding:0 16px 14px 52px}.st.open .det{display:block}
.st:not(:last-child)::before{content:"";position:absolute;left:27px;top:38px;bottom:-12px;width:2px;border-radius:2px;background:var(--line);z-index:1;pointer-events:none}
.st.s-pass:not(:last-child)::before,.st.s-warn:not(:last-child)::before,.st.s-fail_hold:not(:last-child)::before,.st.s-unverified:not(:last-child)::before,.st.s-info:not(:last-child)::before{background:var(--line2)}
.st.s-pending:not(:last-child)::before{background:repeating-linear-gradient(var(--line2) 0 3px,transparent 3px 7px)}
.st.flow:not(:last-child)::before{background:linear-gradient(180deg,var(--line2) 0%,var(--acc) 50%,var(--line2) 100%);background-size:100% 220%;animation:flow .9s linear infinite}
@keyframes flow{from{background-position:0 100%}to{background-position:0 -120%}}
@property --ba{syntax:"<angle>";inherits:false;initial-value:0deg}
.beam{position:relative}
.beam::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--ba),transparent 0 62%,var(--acc) 82%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ba 2.6s linear infinite}
@keyframes ba{to{--ba:360deg}}
.btn.pri.busy{position:relative;overflow:hidden}

function choose(files){

    else if(/\.(docx?|xlsx?|pptx?|odt|ods|pages|numbers)$/i.test(f.name))bad.push(`“${f.name}” is an Office document. Export the invoice as PDF and upload that.`);
    else if(/\.msg$/i.test(f.name))bad.push(`“${f.name}” is an Outlook .msg file. Forward the e-mail as an attachment (.eml) or save the invoice attachment.`);
    else if(!ACCEPT.test(f.name)&&!/^(application\/pdf|image\/|message\/rfc822|application\/zip)/.test(f.type))bad.push(`“${f.name}” is not a supported file. Use PDF, JPG, PNG, TIFF, WebP, .eml or .zip.`);
    else if(f.size===0)bad.push(`“${f.name}” is empty.`);
    else if(f.size>10*1024*1024)bad.push(`“${f.name}” is ${(f.size/1048576).toFixed(1)} MB — the limit is 10 MB per upload.`);

  if(bad.length)err.innerHTML=`<div class="alert bad">${ic('alert')}<span>${bad.map(esc).join('<br>')}</span></div>`;

async function uploadOne(f){

    try{return await api('/api/upload',{method:'POST',body:await f.arrayBuffer(),headers:{'X-Filename':encodeURIComponent(f.name)}})}
    catch(e){if((e.status===503)&&attempt<12){await new Promise(r=>setTimeout(r,2500));continue}throw e}
  }
}

    const ids=[],skipped=[],errs=[];let i=0;
    for(const f of picked.files){i++;if(picked.files.length>1)go.innerHTML=`<span class="spin"></span>Uploading ${i} of ${picked.files.length}…`;

}

    <div class="card"><div class="ch"><h2>Matched purchase order</h2>${vi?`<span class="sub">${esc(vi.name)}</span>`:''}</div><div class="cb">${poHtml}</div></div>`;

  if(done&&!paintRun._ticked?.has(r.id)){(paintRun._ticked=paintRun._ticked||new Set()).add(r.id);tickers($('#side'))}else if(done){$('#side').querySelectorAll('[data-tick]').forEach(el=>el.textContent=fmtT[el.dataset.fmt||'int'](parseFloat(el.dataset.tick)||0))}

   `<div class="kpis"><div class="card kpi warn"><span>Waiting for a decision</span><b class="num">${q.length}</b><small>${inr(q.reduce((s,r)=>s+(r.extracted.total||0),0))} on hold</small></div><div class="card kpi"><span>Awaiting vendor reply</span><b class="num">${q.filter(r=>r.awaiting_vendor).length}</b><small>query recorded</small></div><div class="card kpi ok"><span>Decided on review</span><b class="num">${done}</b><small>with a recorded reason</small></div><div class="card kpi bad"><span>Failed to process</span><b class="num">${failed.length}</b><small>retry from the run</small></div></div>

   :`<div class="empty"><div class="ill">${ic('check')}</div><b>Nothing waiting</b>Every processed invoice has a decision. Held invoices will appear here.</div>`}</div></div>
   ${failed.length?`<div class="card" style="margin-top:16px"><div class="ch"><h2>Failed to process</h2></div><div class="tablewrap"><table class="t"><tbody>${failed.map(r=>`<tr class="r" data-id="${r.id}"><td class="c-inv"><a class="lnk" href="#/run/${r.id}">${esc(r.filename)}</a><div class="sub">${esc(r.error)}</div></td><td class="c-dec"><span class="badge b-bad">Failed</span></td></tr>`).join('')}</tbody></table></div></div>`:''}`;

  ${n?`<div class="grid2" style="margin-bottom:16px"><div class="card"><div class="cb"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>Value by decision</b><span class="sub num">${inr(sum(R.filter(r=>!r.error)))}</span></div><div class="mix" role="img" aria-label="Share of invoice value by decision"><i style="width:${sum(ok)/tot*100}%;background:var(--ok)"></i><i style="width:${sum(hold)/tot*100}%;background:var(--warn)"></i><i style="width:${sum(rej)/tot*100}%;background:var(--bad)"></i></div><div class="legend"><span><i style="background:var(--ok)"></i>Approved ${inr0(sum(ok))}</span><span><i style="background:var(--warn)"></i>On hold ${inr0(sum(hold))}</span><span><i style="background:var(--bad)"></i>Rejected ${inr0(sum(rej))}</span></div></div></div>
   <div class="card"><div class="cb"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>Decided without a person</b><span class="num" style="font-weight:700;font-size:18px">${stp}%</span></div><div class="mix"><i style="width:${stp}%;background:var(--acc)"></i></div><div class="legend"><span>${ic('pdf')}${srcN('pdf')} PDF</span><span>${ic('img')}${srcN('img')} photo/scan</span><span>${ic('mail')}${srcN('email')} from e-mail</span><span>${ic('zip')}${srcN('zip')} from ZIP</span>${fail?`<span style="color:var(--bad)">${fail} failed</span>`:''}</div></div></div></div>`:''}
  <div class="card"><div class="tools"><div class="search">${ic('search')}<input id="q" type="search" placeholder="Search vendor, invoice no., PO, reason…   ( / )" aria-label="Search runs" value="${esc(HF.q==='—'?'':HF.q)}"></div>
   <div class="seg" role="group" aria-label="Filter by decision">${[['ALL','All'],['APPROVE','Approved'],['HOLD','On hold'],['REJECT','Rejected'],['REVIEW','Needs review']].map(([k,l])=>`<button data-s="${k}" aria-pressed="${HF.s===k}">${l}</button>`).join('')}</div></div>
   <div class="tablewrap" id="tbl"></div></div>`;

  if(!n)$('#export').setAttribute('aria-disabled','true');
  const clr=$('#clear');if(clr)clr.onclick=async()=>{if(!n)return toast('History is already empty');if(!confirm('Permanently delete all '+n+' saved runs? Duplicate detection will start from scratch.'))return;try{await api('/api/reset',{method:'POST',body:'{}'});toast('History cleared');viewHistory(null,ctl)}catch(e){toast(e.message)}};
}

/* ---------- rules & edge cases ---------- */
const CASES=[
 ['Happy path','Clean PDF, known vendor, explicit PO, amounts reconcile','Approved — every check passed; “eligible for payment processing”','01'],
 ['Scanned or photographed invoice','No text layer, a phone photo taken sideways, a TIFF from the office scanner','Turned upright, read with OCR; every value re-validated, OCR confusions never trusted blindly','02'],
 ['Split PO / milestone billing','One PO billed across several invoices','Approved while the PO has balance; the last one closes it; a further one is held','03'],
 ['Duplicate re-send','Same invoice number from the same vendor, or the identical file again (also as a photo or inside an e-mail)','Rejected — “do not pay twice”, linked to the approved run','05'],
 ['Missing information','No invoice number, date or total','Held for vendor follow-up; the missing fields are listed; reviewers cannot approve without them','06'],
 ['Price above PO','Unit price or total beyond the 2% tolerance','Held with the exact difference; a reviewer may approve with a reason (e.g. PO amendment)','07'],
 ['No PO printed','PO has to be inferred from the vendor and amount','Approved only if exactly one open PO fits; flagged as inferred for audit','08'],
 ['Bank details changed','Account or IFSC differs from the vendor master','Held as a fraud risk; approving on review carries a call-back warning','09'],
 ['Multi-page and odd layouts','Line items on page 2, other labels, dd/mm/yyyy, CGST + SGST, “Rs.”','Read and reconciled like any other invoice','10'],
 ['Arithmetic errors','Qty × price ≠ line, lines ≠ subtotal, wrong tax, wrong total','Held: “invoice arithmetic does not reconcile”, with each failing sum',''],
 ['Identity conflict','A different GSTIN, or a GSTIN that belongs to another vendor','Held — a matching name never overrides a conflicting GSTIN',''],
 ['Impossible or ambiguous dates','31/99/2026, US-style dates, OCR-squashed dates like “05Nov2026”','Impossible dates are held with the reason; day-first reading is stated on screen',''],
 ['Corrected resubmission','Vendor fixes a held invoice and sends it again','Checked from scratch, linked to the held run, approved at most once',''],
 ['E-mail with several attachments','A forwarded e-mail with two invoices and a signature logo','Each invoice attachment becomes a run; logos and signatures are skipped and listed',''],
 ['Month-end ZIP batch','A ZIP of PDFs and photos, plus readme files and Mac metadata','Processed in order, one at a time; non-invoices are skipped with a reason',''],
 ['Unreadable or wrong file','Word or Excel invoice, iPhone HEIC, Outlook .msg, corrupt or empty files','Refused before processing with a specific instruction to fix it',''],
 ['LLM unavailable or wrong','The AI provider is down, out of credits, or suggests a value that is not on the page','Rules continue alone; ungrounded AI values are discarded and listed',''],
 ['Two copies at the same moment','The same invoice uploaded twice in parallel, or two invoices racing for the last of a PO','Decided inside one database transaction — only one can be approved','']];
async function viewPolicy(){
  const R=CFG.rules;
  $('#app').innerHTML=head('Rules &amp; edge cases','How InvoiceDesk decides, written for the AP team. The model never decides: extraction produces fields, deterministic checks decide, and a person handles the exceptions.','<a class="btn" href="#/guide">Guide</a>',ic('shield')+'Policy')+
  `<div class="toc">${[['p-tol','Tolerances'],['p-checks','The ten checks'],['p-matrix','Decision matrix'],['p-cases','Edge cases handled']].map(([k,l])=>`<button class="chip" style="cursor:pointer" data-jump="${k}">${l}</button>`).join('')}</div>
  <section class="sec" id="p-tol"><h2>Tolerances and settings</h2><div class="kpis">
   <div class="card kpi"><span>Price / amount tolerance</span><b class="num">${R.price_tolerance_pct}%</b><small>above the PO balance → hold</small></div>
   <div class="card kpi"><span>Rounding allowance</span><b class="num">₹${R.rounding_allowance_inr.toFixed(2)}</b><small>on sums; ₹${R.line_rounding_per_unit_inr} × qty on a line</small></div>
   <div class="card kpi"><span>Vendor name match</span><b class="num">${Math.round(R.fuzzy_vendor_name*100)}%</b><small>similarity — GSTIN always wins</small></div>
   <div class="card kpi"><span>OCR identity recovery</span><b class="num">≥ ${R.ocr_identity_min_corroborations}</b><small>independent signals must agree</small></div></div>
   <p class="sub">Required fields: ${R.required_fields.map(k=>({vendor:'vendor name',invoice_no:'invoice number',invoice_date:'invoice date',total:'total'})[k]||k).map(esc).join(', ')}. Dates are read day-first; accepted years ${R.date_year_range[0]}–${R.date_year_range[1]}. No rule compares a date with today.</p></section>
  <section class="sec" id="p-checks"><h2>The ten checks, in order</h2><div class="card"><div class="tablewrap"><table class="t"><thead><tr><th>Stage</th><th>What it checks</th><th class="hide-m">If it fails</th></tr></thead><tbody>
   ${[['Ingest','Stores the file once, immutably; fingerprints it; converts photos and scans to PDF; unpacks e-mails and ZIPs','Unsupported files are refused with a fix'],['Extract','Text layer first; OCR per page where there is none; optional LLM fills only gaps it can ground in the page','Rules continue alone; ungrounded values discarded'],['Required fields','Vendor, invoice number, valid date, total','Hold — vendor follow-up'],['Vendor master','GSTIN, name, bank and PO ownership against the master','Hold — identity conflict'],['Duplicate detection','Same vendor + invoice number, or the same file, against approved and held runs','Reject if already approved; linked if a correction'],['Arithmetic integrity','Every line, subtotal, tax and total in exact decimals','Hold — does not reconcile'],['PO matching','Printed PO, or exactly one open PO inferred from vendor and amount','Hold — no PO or ambiguous'],['Amount & tolerance','Invoice against the PO balance after earlier approvals; unit prices against PO lines','Hold — above tolerance'],['Bank details','Account and IFSC against the vendor master','Hold — possible fraud'],['Decision','Approve only if every required check actually ran and passed','Anything not verified is held, never shown as passed']].map(([a,b,c])=>`<tr><td><b>${a}</b></td><td>${b}</td><td class="hide-m sub">${c}</td></tr>`).join('')}</tbody></table></div></div></section>
  <section class="sec" id="p-matrix"><h2>Decision matrix</h2><div class="grid3">
   <div class="card"><div class="cb"><span class="badge b-ok">Approve</span><p class="sub" style="margin:8px 0 0">Every required check ran and passed. Notes (OCR used, PO inferred, LLM assisted) are shown but do not block. Recorded as eligible for payment processing — nothing is paid from here.</p></div></div>
   <div class="card"><div class="cb"><span class="badge b-warn">Hold</span><p class="sub" style="margin:8px 0 0">Anything a person must look at: missing or invalid fields, identity or bank conflicts, arithmetic, price above tolerance, no PO, or a check that could not run. Goes to the review queue.</p></div></div>
   <div class="card"><div class="cb"><span class="badge b-bad">Reject</span><p class="sub" style="margin:8px 0 0">A duplicate of an invoice that is already approved — paying it would pay twice. A reviewer can also reject a held invoice, with a reason.</p></div></div></div></section>
  <section class="sec" id="p-cases"><h2>Edge cases handled <span class="sub" style="font-weight:500">(${CASES.length})</span></h2><div class="cases">${CASES.map(([t,w,h,s])=>`<div class="case"><h3>${esc(t)}${s?`<span class="badge ${DEC[SCEN[s][2]][2]} nodot">${DEC[SCEN[s][2]][0]}</span>`:''}</h3><p>${esc(w)}</p><div class="how">${ic('check')} ${esc(h)}</div>${s?`<div class="foot"><button class="btn sm" data-try="${s}">${ic('play')}Try sample ${s}</button></div>`:''}</div>`).join('')}</div></section>`;
  $$('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'}));
  $$('[data-try]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{if(!samplesCache)samplesCache=await api('/api/samples');const f=samplesCache.find(x=>x.startsWith(b.dataset.try));const r=await api('/api/process_sample',{method:'POST',body:JSON.stringify({name:f})});location.hash='#/run/'+r.id}catch(e){toast(e.message);b.disabled=false}});
}

/* ---------- guide ---------- */
async function viewGuide(){
  const x=CFG.extraction;
  $('#app').innerHTML=head('Guide','Everything you need to use InvoiceDesk — in two minutes.',`<button class="btn pri" data-act="tour">${ic('play')}Start the guided tour</button>`,ic('book')+'Help')+
  `<section class="sec"><h2>How it works</h2><div class="flow">
    <div><b><span class="num-ic">${ic('up')}</span>Receive</b><p>PDF, photo, scan, forwarded e-mail or ZIP. Each document is stored once, fingerprinted and prepared as a PDF.</p></div>
    <div><b><span class="num-ic">${ic('scan')}</span>Read</b><p>Text layer first, OCR where needed${x.llm_configured?', an AI model only for gaps it can prove from the page':''}. Every value is re-validated.</p></div>
    <div><b><span class="num-ic">${ic('calc')}</span>Check</b><p>Vendor master, duplicates, arithmetic, PO balance and tolerance, bank details — in one consistent transaction.</p></div>
    <div><b><span class="num-ic">${ic('check')}</span>Decide</b><p>Approve, hold or reject with every reason shown. Held invoices wait for a person in the review queue.</p></div></div></section>
  <div class="grid2"><section class="sec card"><div class="ch"><h2>Process your first invoice</h2></div><div class="cb prose"><ol>
    <li>Open <a class="lnk" href="#/upload">Process invoices</a> and drop a file — or pick one of the 11 sample invoices.</li>
    <li>Press <b>Process invoice</b>. The run page shows each of the ten checks as it happens; open any check to see the comparison behind it.</li>
    <li>Read the decision card: the outcome, the amount, and a recommended next step.</li>
    <li>If it is <b>on hold</b>, decide it in the <b>Your decision</b> card: approve, reject or ask the vendor (a ready-to-copy query is drafted for you). A reason is always required.</li>
    <li>See everything in <a class="lnk" href="#/history">Dashboard &amp; history</a>, and export it as CSV for your ERP or auditor.</li></ol></div></section>
   <section class="sec card"><div class="ch"><h2>What you can upload</h2></div><div class="cb"><dl class="kv">
    <dt>${ic('pdf')} PDF</dt><dd>Digital or scanned, any number of pages</dd><dt>${ic('img')} Photos</dt><dd>JPG, PNG, WebP, BMP, GIF — sideways phone photos are turned upright</dd><dt>${ic('scan')} Scans</dt><dd>TIFF, including multi-page</dd>
    <dt>${ic('mail')} E-mail</dt><dd>.eml (forward as attachment) — every invoice attachment is processed; logos and signatures are skipped</dd><dt>${ic('zip')} ZIP</dt><dd>Up to 25 documents, processed in order</dd>
    <dt>${ic('x')} Not yet</dt><dd>Word/Excel (export to PDF), iPhone HEIC (share as JPEG), Outlook .msg (forward as .eml). Max 10 MB per upload.</dd></dl></div></section></div>
  <section class="sec"><h2>A five-minute demo, in order</h2><div class="card"><div class="cb"><ol class="prose" style="margin:0;padding-left:20px">
    <li><b>01 Clean PDF</b> → approved. Open the timeline to show each check.</li><li><b>05 Duplicate re-send</b> → rejected: “do not pay twice”, linked to 01.</li>
    <li><b>07 Price variance</b> → held. Approve it in <i>Your decision</i> with a reason; watch the PO balance move.</li><li><b>09 Bank details changed</b> → held as fraud risk. Ask the vendor: show the drafted query.</li>
    <li><b>02 Scanned image</b> → read with OCR and approved.</li><li>Finish on the <b>dashboard</b>: value by decision, straight-through rate, CSV export.</li></ol>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="samples">${ic('layers')}Run all 11 samples as one batch</button><a class="btn ghost" href="#/policy">See every edge case</a></div></div></div></section>
  <section class="sec"><h2>Questions</h2><div class="card faq">
    <details><summary>Does InvoiceDesk pay invoices?</summary><p>No. It records a decision. An approved invoice is “eligible for payment processing”; scheduling the payment stays in your payment system. Nothing is e-mailed to vendors either — vendor queries are drafts you copy.</p></details>
    <details><summary>Who can see my uploads?</summary><p>${CFG.workspaces?`Only this browser. Each visitor gets a private workspace (a random cookie) with its own history, documents and PO balances. It is cleared after ${esc(CFG.workspace_ttl_hours)} hours without use.`:'Everyone using this server sees the same history.'} Do not upload real financial documents to a public demo.</p></details>
    <details><summary>What does the AI do — and not do?</summary><p>${x.llm_configured?`It is asked only when the rules leave gaps (provider chain: ${esc(x.llm_providers.join(' → '))}). It may only fill a field with a value that is printed next to that field’s label on the page; anything else is discarded and listed. It never decides.`:'No AI model is configured on this server; extraction uses rules and OCR only.'}</p></details>
    <details><summary>What if OCR misreads something?</summary><p>OCR values are re-validated like everything else. A misread GSTIN, amount or date makes a check fail, so the invoice is held — never approved on a guess. Identity can only be recovered when at least two independent signals agree.</p></details>
    <details><summary>Can a reviewer approve anything?</summary><p>No. A reviewer can approve a held invoice with a written reason, but not one without a vendor match, invoice number or total, and never a second copy of an approved invoice. Bank changes carry a call-back warning. The automated decision stays on record next to the reviewer’s.</p></details>
    <details><summary>Where do the purchase orders and vendors come from?</summary><p>From the reference register shown under Purchase orders and Vendor master — a stand-in for your ERP. Balances update as invoices are approved.</p></details></div></section>
  <section class="sec"><h2>Keyboard shortcuts</h2><div class="card"><div class="cb shortcuts"><kbd>u</kbd><span>Process invoices</span><kbd>r</kbd><span>Review queue</span><kbd>h</kbd><span>Dashboard &amp; history</span><kbd>/</kbd><span>Search history</span><kbd>t</kbd><span>Guided tour</span><kbd>?</kbd><span>All shortcuts</span></div></div></section>`;
}

const TOUR=[
 {r:'upload',s:'#drop',t:'Drop invoices here',b:'PDFs, phone photos, scans, forwarded e-mails or a ZIP of the month’s invoices. Several files at once is fine.'},
 {r:'upload',s:'#samplecard',t:'Or start with a sample',b:'Eleven realistic invoices — the happy path and the edge cases. The badge shows what the desk should decide.'},
 {r:'upload',s:'#go',t:'Process',b:'Starts a run. You land on a live view where each of the ten checks appears as it executes.'},
 {r:'upload',s:'#n-review',t:'The review queue',b:'Anything the checks cannot approve on their own waits here for a person: approve, reject or ask the vendor — always with a reason.'},
 {r:'upload',s:'#n-history',t:'Dashboard & history',b:'Every run, its outcome and the value by decision. Search, filter and export to CSV.'},
 {r:'upload',s:'#n-policy',t:'Rules & edge cases',b:'The tolerances, the ten checks and the 18 edge cases this desk handles — each with a sample you can run.'},
 {r:'upload',s:'#n-guide',t:'Help is always here',b:'The guide, a five-minute demo script and keyboard shortcuts. Press ? anytime.'}];
let tourI=-1;
function startTour(){tourI=0;store.set('welcomed',true);showTourStep()}
function endTour(silent){tourI=-1;$('#overlay').innerHTML='';if(!silent)toast('Tour finished — press t to see it again')}
async function showTourStep(){
  if(tourI<0)return;if(tourI>=TOUR.length)return endTour();
  const s=TOUR[tourI];if(!location.hash.startsWith('#/'+s.r)){location.hash='#/'+s.r;await new Promise(r=>setTimeout(r,450))}
  const small=matchMedia('(max-width:820px)').matches;if(small&&s.s.startsWith('#n-'))document.body.classList.add('nav-open');else document.body.classList.remove('nav-open');
  await new Promise(r=>setTimeout(r,small?260:60));
  const el=$(s.s);if(!el){tourI++;return showTourStep()}
  el.scrollIntoView({block:'center',behavior:'smooth'});await new Promise(r=>setTimeout(r,250));
  const b=el.getBoundingClientRect(),pad=6,W=innerWidth,H=innerHeight;
  const pop=Math.min(340,W-32),below=b.bottom+190<H,left=Math.max(16,Math.min(W-pop-16,b.left));
  $('#overlay').innerHTML=`<div class="tour-hole" style="left:${b.left-pad}px;top:${b.top-pad}px;width:${b.width+pad*2}px;height:${b.height+pad*2}px"></div>
   <div class="tour-pop" role="dialog" aria-label="Tour step ${tourI+1} of ${TOUR.length}" style="left:${left}px;${below?`top:${Math.min(H-200,b.bottom+14)}px`:`top:${Math.max(16,b.top-200)}px`}"><h3>${esc(s.t)}</h3><p>${esc(s.b)}</p>
   <div class="foot"><span class="sub num">${tourI+1} / ${TOUR.length}</span><button class="btn sm ghost" id="tskip">Skip</button>${tourI?'<button class="btn sm" id="tback">Back</button>':''}<button class="btn sm pri" id="tnext">${tourI===TOUR.length-1?'Done':'Next'}</button></div></div>`;
  $('#tnext').onclick=()=>{tourI++;showTourStep()};$('#tskip').onclick=()=>{document.body.classList.remove('nav-open');endTour(true)};const bk=$('#tback');if(bk)bk.onclick=()=>{tourI--;showTourStep()};$('#tnext').focus();
}
